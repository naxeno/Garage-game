<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гараж — выбей авто</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{max-width:520px;margin:0 auto;padding:12px 14px 40px;min-height:100vh}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}

.bal{margin-left:auto;text-align:right}.bal small{display:block;color:var(--mut);font-size:12px;font-weight:600}.bal b{font-size:24px;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;margin-bottom:14px}

.tabs button.on{background:var(--ink);color:var(--bg)}

.car .rn{font-weight:800;font-size:14px;color:var(--rc)}.car .vl{font-weight:700;font-size:14px;color:var(--mut)}
.car.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.05)}}
.r5{background:linear-gradient(90deg,#ff3d6e,#ffb300,#2ee59d,#3d8bff,#c13dff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.car.s5{border-image:linear-gradient(90deg,#ff3d6e,#ffb300,#2ee59d,#3d8bff,#c13dff) 1;border-radius:0}
.res{text-align:center;font-weight:700;min-height:24px;margin:10px 0 0}
.row{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;background:var(--card);border:2px solid transparent;color:var(--ink);font:700 14px Manrope,sans-serif;padding:10px 13px;border-radius:999px}
.chip.on{border-color:var(--gold)}.chip:disabled{opacity:.35}
.go{width:100%;border:0;border-radius:18px;padding:19px;font:800 19px Manrope,sans-serif;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--on-gold)}
.go:disabled{opacity:.55}.go.no{background:var(--card);color:var(--ink)}
.luck{width:100%;margin-top:10px;background:none;border:2px dashed var(--gold);color:var(--ink);border-radius:14px;padding:12px;font:700 14px Manrope,sans-serif}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .car{padding:10px 8px;border-width:2px;border-radius:14px}.g .car .md{font-size:18px}.g .car .fl{font-size:22px}.g .car .br{font-size:12px}

.bt button.up{background:var(--gold);color:var(--on-gold)}
.sil{display:block;width:100%;max-width:250px;height:auto;margin:0 auto 6px}.g .sil{max-width:140px}
.empty{color:var(--mut);text-align:center;padding:36px 10px;line-height:1.5}
.sum{color:var(--mut);font-weight:700;font-size:13px;margin-bottom:10px}
.hide{display:none}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}.mod.hide{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ci{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:700 15px Manrope,sans-serif;text-align:left}
.ci.on{border-color:var(--gold)}.ci .cf{font-size:26px}.ci .ct{flex:1;display:flex;flex-direction:column}.ci small{color:var(--mut);font-weight:600;font-size:12px}.ci .cp{font-weight:800}
.sh-t{font-weight:800;font-size:18px;text-align:center;margin-bottom:12px}
.ctrw{margin:12px 0 0}
.cbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--gold);color:var(--ink);border-radius:16px;padding:14px 16px;font:700 15px Manrope,sans-serif}
.clist{margin-top:6px;background:var(--card);border-radius:16px;overflow:hidden}
.clist button{width:100%;display:flex;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:700 15px Manrope,sans-serif;padding:13px 16px}
.clist button.on{background:var(--line)}.clist button:last-child{border-bottom:0}
.sheet .g .bt button{padding:10px 2px;line-height:1.25}
.g3{grid-template-columns:repeat(3,1fr);gap:8px}.g3 .car .md{font-size:13px}.g3 .car .vl{font-size:11px}.g3 .car .rn{font-size:11px}
.reel.s3 .rwin{height:112px;border-bottom:1px solid var(--line)}.reel.s3 .rt{width:110px;height:112px;padding-top:6px}.reel.s3 .rt .sil{max-width:92px}.reel.s3 .rm{font-size:11px}
.inp{flex:1;min-width:0;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:10px 14px;font:700 14px Manrope,sans-serif}
.bt2{margin-top:10px}
.pic{display:block;width:100%;max-width:270px;border-radius:12px;margin:0 auto 6px;background-color:#0d1117;background-repeat:no-repeat}.g .pic{max-width:150px}.rt .pic{max-width:134px}
.car.reel{padding:0;overflow:hidden;display:block;min-height:0}
.rwin{position:relative;overflow:hidden;width:100%;height:158px}
.rstrip{display:flex;position:absolute;left:0;top:0;will-change:transform}
.rt{flex:none;width:150px;padding:14px 8px 0;text-align:center;border-right:1px solid var(--line);height:158px}
.rt .sil{max-width:130px}.rm{font-weight:800;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rptr{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 12px var(--gold)}
.car.flash{animation:pop .5s,fl 1.4s}@keyframes fl{0%,100%{box-shadow:0 0 28px -8px var(--rc)}40%{box-shadow:0 0 70px 8px var(--rc)}}
.zone{position:relative;height:18px;background:var(--bad);border-radius:9px;margin:16px 0 6px;overflow:hidden;opacity:.9}
.zone i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.zone b{position:absolute;top:-2px;bottom:-2px;left:0;width:5px;background:var(--ink);border-radius:3px;transition:left 1.6s cubic-bezier(.2,.7,.2,1)}
.info{display:flex;justify-content:space-between;color:var(--mut);font-weight:700;font-size:13px}
</style>
</head>

<div id="mod" class="mod hide"><div class="sheet" id="sheet"></div></div>

  setTimeout(()=>{
    if(r<p){Object.assign(it,mk(CARS.indexOf(tg)));$('ures').innerHTML='<span style="color:var(--ok)">Успех! Получено: '+tg.b+' '+tg.m+'</span>';$('usrc').innerHTML=card(it,{cls:'pop'})}
    else{S.garage=S.garage.filter(x=>x!==it);S.sel=null;$('ures').innerHTML='<span style="color:var(--bad)">Неудача. Машина потеряна.</span>'}
    busy=false;save();const m=$('ures').innerHTML;render();$('ures').innerHTML=m;
  },1750);
}
document.addEventListener('click',e=>{
  const g=k=>{const t=e.target.closest('['+k+']');return t?t.getAttribute(k):null};
  const t=g('data-t');if(t)tab(t);
  const cs=g('data-cs');if(cs!==null&&!busy){S.cs=+cs;COPEN=false;save();render()}
  if(g('data-copen')!==null&&!busy){COPEN=!COPEN;render()}
  if(e.target.id=='mod2'){COPEN=false;render()}
  const nn=g('data-n');if(nn&&!busy){S.cnt=+nn;save();render()}
  const ps=g('data-psell');if(ps&&!busy)sellP([+ps]);
  if(g('data-psellall')!==null&&!busy)sellP(S.pend.map(x=>x.u));
  if(g('data-keep')!==null||e.target.id=='mod')keepP();
  const cp=g('data-copy');if(cp){try{navigator.clipboard.writeText(cp)}catch(x){};e.target.textContent='Скопировано'}
  if(g('data-bind')!==null){const v=$('refin');if(v&&!bindRef(v.value))v.value=''}
  const m=g('data-m');if(m&&!busy){S.mult=+m;render()}
  const s=g('data-sell');if(s&&!busy){const it=S.garage.find(x=>x.u==s);if(it){S.bal+=val(it);S.garage=S.garage.filter(x=>x!==it);if(S.sel==it.u)S.sel=null;save();render()}}
  const u=g('data-up');if(u&&!busy){S.sel=+u;$('ures').textContent='';render();tab('up')}
});
function tab(t){if(t!='play'&&S.pend.length){S.garage=S.garage.concat(S.pend);S.pend=[];save();render()}document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));['play','garage','up','fr'].forEach(k=>$(k).classList.toggle('hide',k!=t))}
$('go').onclick=()=>{const m=$('go').dataset.m;if(m=='bonus'){S.bal+=50000;save();render()}else if(m=='spin')spin()};
$('ugo').onclick=upgrade;
$('lk').onclick=()=>{S.luckUntil=Date.now()+120000;save();render();setTimeout(render,120500)};
let DB=null;
function refDrop(x){const c=CARS[x.i];if(c.t<2||!S.refBy||!DB)return;
  DB.collection('ref_events').add({to:S.refBy,from:S.me,car:c.b+' '+c.m,amount:Math.round(x.v*.1),claimed:false,ts:Date.now()}).catch(()=>{})}
function bindRef(code){code=(code||'').trim().toLowerCase();if(!code||code==S.me||S.refBy)return false;S.refBy=code;save();
  if(DB)DB.doc('ref_friends/'+S.me).set({inviter:code,ts:Date.now()}).catch(()=>{});renderFr();return true}
function frStart(){
  if(!(window.claude&&claude.use))return;
  claude.use('db').then(d=>{if(!d)return;DB=d;
    d.collection('ref_events').where('to','==',S.me).onSnapshot(sn=>{let add=0;
      sn.docs.forEach(x=>{const v=x.data();if(!v||v.claimed||S.paid[x.id])return;S.paid[x.id]=1;add+=v.amount;d.doc('ref_events/'+x.id).update({claimed:true}).catch(()=>{})});
      if(add){S.bal+=add;S.refEarned=(S.refEarned||0)+add;save();render();$('res').textContent='Друг принёс +'+fmt(add)}},()=>{});
    d.collection('ref_friends').where('inviter','==',S.me).onSnapshot(sn=>{S.friends=sn.size;renderFr()},()=>{});
    if(S.refBy)d.doc('ref_friends/'+S.me).set({inviter:S.refBy,ts:Date.now()}).catch(()=>{});
    renderFr();
  }).catch(()=>{});
}
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
  const q=new URLSearchParams(location.search).get('ref')||((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'').replace(/^ref_/,'');
  if(q)bindRef(q)}catch(e){}
frStart();
$('card').outerHTML='<div class="car big" id="card"><div class="fl">🏁</div><div class="md">Выбей машину</div><div class="vl">Выбери контейнер и крути</div></div>';
render();
</script>
